name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Supply-chain policy (pinned actions and submodules, exact versions, official registry, no install scripts)
        run: python3 .github/policy.py

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.5.1

      - name: Build
        run: forge build --sizes

      - name: Unit tests
        run: forge test --no-match-path "test/fork/*" -vv

      - name: Safe deployment init code hash
        run: forge script script/PredictRouter.s.sol
